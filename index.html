// Nivel de exigencia según racha de cumplimiento reciente
function getDifficultyLevel(data) {
  const days = getWeekDays();
  let completedDays = 0;
  days.forEach(d => {
    const dg = data.dailyGoals?.[d];
    if (dg && dg.goals) {
      const done = dg.goals.filter(g => g.done).length;
      if (done >= Math.ceil(dg.goals.length * 0.75)) completedDays++;
    }
  });
  if (completedDays >= 4) return {
    level: "alto",
    label: "avanzado"
  };
  if (completedDays >= 2) return {
    level: "medio",
    label: "intermedio"
  };
  return {
    level: "suave",
    label: "inicial"
  };
}

// Calcula calorías objetivo a partir de datos básicos + tipo de cuerpo actual/meta
function computePlan({
  sex,
  age,
  height,
  weight,
  activityLevel,
  bodyNow,
  bodyGoal
}) {
  const w = parseFloat(weight) || 70;
  const h = parseFloat(height) || 170;
  const a = parseFloat(age) || 30;
  // Mifflin-St Jeor
  const bmr = sex === "mujer" ? 10 * w + 6.25 * h - 5 * a - 161 : 10 * w + 6.25 * h - 5 * a + 5;
  const factors = {
    sedentario: 1.2,
    ligero: 1.375,
    moderado: 1.55,
    activo: 1.725
  };
  const maintenance = bmr * (factors[activityLevel] || 1.375);

  // Escala de cuerpos: 0 más delgado → 4 más corpulento
  const scale = {
    delgado: 0,
    promedio: 1,
    sobrepeso: 2,
    atletico: 1.5,
    musculoso: 2.5
  };
  const now = scale[bodyNow] ?? 1;
  const goal = scale[bodyGoal] ?? 1;
  let objective, dailyCalories, note;
  if (goal < now) {
    objective = "perder";
    dailyCalories = Math.round(maintenance - 500);
    note = "Déficit moderado para bajar grasa de forma saludable (~0.5 kg/semana).";
  } else if (goal > now) {
    objective = "ganar";
    dailyCalories = Math.round(maintenance + 300);
    note = "Superávit ligero para ganar músculo sin acumular mucha grasa.";
  } else {
    objective = "mantener";
    dailyCalories = Math.round(maintenance);
    note = "Mantenimiento para conservar tu peso y mejorar composición corporal.";
  }
  // Macros: proteína alta (2g/kg), grasas 25%, resto carbos
  const protein = Math.round(w * 2);
  const fats = Math.round(dailyCalories * 0.25 / 9);
  const carbs = Math.round((dailyCalories - protein * 4 - fats * 9) / 4);
  return {
    dailyCalories,
    protein,
    carbs: Math.max(carbs, 0),
    fats,
    objective,
    maintenance: Math.round(maintenance),
    note
  };
}

function todayKey() {

// Devuelve lunes de la semana actual
function getWeekStart() {
  const d = new Date();
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return d.toISOString().split("T")[0];
}

// Devuelve array de fechas de la semana actual (lun-dom)
function getWeekDays() {
  const start = new Date(getWeekStart() + "T00:00:00");
  return Array.from({
    length: 7
  }, (_, i) => {
    const d = new Date(start);
    d.setDate(d.getDate() + i);
    return d.toISOString().split("T")[0];
  });
}

// Suma de puntos de la semana actual
function weeklyPoints(data) {
  const week = getWeekDays();
  return week.reduce((sum, d) => sum + (data.pointsLog && data.pointsLog[d] || 0), 0);
}

// ─── EVALUADOR AUTOMÁTICO DE METAS ───────────────────────────
function evaluateWeeklyGoals(weeklyGoals, allUsersData) {
  const weekDays = getWeekDays();
  const results = {};

  // Combinar datos de ambos usuarios
  const combined = {
    meals: {},
    exercise: {},
    weightLog: []
  };
  Object.values(allUsersData).forEach(ud => {
    if (!ud) return;
    weekDays.forEach(d => {
      if (ud.meals?.[d]) combined.meals[d] = [...(combined.meals[d] || []), ...(ud.meals[d] || [])];
      if (ud.exercise?.[d]) combined.exercise[d] = ud.exercise[d]; // ejercicio es individual
    });
    if (ud.weightLog) combined.weightLog.push(...ud.weightLog);
  });

  // ── Calorías ──
  if (weeklyGoals.calories.enabled) {
    const daysChecked = weekDays.filter(d => (combined.meals[d] || []).length > 0);
    const daysMet = daysChecked.filter(d => {
      const total = (combined.meals[d] || []).reduce((s, m) => s + (m.calories || 0), 0);
      return total <= weeklyGoals.calories.target;
    });
    const passed = daysChecked.length >= weeklyGoals.calories.days && daysMet.length >= weeklyGoals.calories.days;
    results.calories = {
      passed,
      daysMet: daysMet.length,
      daysTracked: daysChecked.length,
      needed: weeklyGoals.calories.days
    };
  }

  // ── Ejercicio ──
  if (weeklyGoals.exercise.enabled) {
    const daysWithExercise = weekDays.filter(d => {
      const ex = combined.exercise[d];
      return ex && (ex.completed || ex.logged && ex.logged.length > 0);
    });
    const passed = daysWithExercise.length >= weeklyGoals.exercise.daysPerWeek;
    results.exercise = {
      passed,
      daysDone: daysWithExercise.length,
      needed: weeklyGoals.exercise.daysPerWeek
    };
  }

  // ── Peso ──
  if (weeklyGoals.weight.enabled) {
    const weekStart = getWeekStart();
    const weekLogs = combined.weightLog.filter(w => w.date >= weekStart && w.date <= weekDays[6]).sort((a, b) => a.date.localeCompare(b.date));
    if (weekLogs.length >= 2) {
      const diff = weekLogs[0].weight - weekLogs[weekLogs.length - 1].weight;
      const passed = diff >= weeklyGoals.weight.kgPerWeek;
      results.weight = {
        passed,
        diff: diff.toFixed(1),
        needed: weeklyGoals.weight.kgPerWeek
      };
    } else {
      results.weight = {
        passed: null,
        diff: null,
        needed: weeklyGoals.weight.kgPerWeek
      };
    }
  }

  // ── Macros ──
  if (weeklyGoals.macros.enabled) {
    const daysTracked = weekDays.filter(d => (combined.meals[d] || []).length > 0);
    const daysMet = daysTracked.filter(d => {
      const meals = combined.meals[d] || [];
      const protein = meals.reduce((s, m) => s + (m.protein || 0), 0);
      const carbs = meals.reduce((s, m) => s + (m.carbs || 0), 0);
      const fats = meals.reduce((s, m) => s + (m.fats || 0), 0);
      // Se considera cumplido si se registró comida (simplificado)
      return protein > 0 || carbs > 0 || fats > 0;
    });
    const passed = daysTracked.length >= 5 && daysMet.length >= 5;
    results.macros = {
      passed,
      daysMet: daysMet.length,
      daysTracked: daysTracked.length
    };
  }
  return results;
}

function ExerciseTab({
  data,
  update,
  today,
  todayExercise,
  user
}) {
  const [loading, setLoading] = useState(false);
  const [recommendation, setRecommendation] = useState(todayExercise.recommendation || null);
  const [showLog, setShowLog] = useState(false);
  const [logForm, setLogForm] = useState({
    type: "",
    duration: "",
    burned: ""
  });
  const [mood, setMood] = useState(data.moodLog?.[today] || null);
  const moods = [{
    id: "lleno",
    emoji: "⚡",
    label: "Con energía"
  }, {
    id: "normal",
    emoji: "🙂",
    label: "Normal"
  }, {
    id: "cansado",
    emoji: "😮‍💨",
    label: "Cansado/a"
  }, {
    id: "estresado",
    emoji: "😣",
    label: "Estresado/a"
  }];
  const selectMood = m => {
    setMood(m);
    update(prev => ({
      ...prev,
      moodLog: {
        ...(prev.moodLog || {}),
        [today]: m
      }
    }));
  };
  const getRecommendation = async () => {
    setLoading(true);
    const {
      goals,
      weightLog,
      profile
    } = data;
    const last7 = weightLog.slice(-7);
    const weightTrend = last7.length >= 2 ? (last7[last7.length - 1].weight - last7[0].weight).toFixed(1) : null;

    // Días con ejercicio en los últimos 7 días (para detectar descanso necesario)
    const recentDays = Object.keys(data.exercise || {}).sort().slice(-7);
    const consecutiveDays = (() => {
      let count = 0;
      const d = new Date();
      for (let i = 0; i < 7; i++) {
        const key = d.toISOString().split("T")[0];
        const ex = data.exercise?.[key];
        if (ex && (ex.completed || ex.logged?.length > 0)) count++;else break;
        d.setDate(d.getDate() - 1);
      }
      return count;
    })();
    const moodLabel = moods.find(m => m.id === mood)?.label || "no indicado";
    const prompt = `Eres un entrenador físico profesional, empático y experto. Tu trabajo es recomendar el ejercicio ideal para HOY, adaptándote a la persona real, sin hostigar ni exigir de más. Si la persona está cansada o estresada, ofrece algo suave o incluso descanso activo. Si lleva muchos días seguidos entrenando, prioriza recuperación. Habla en tono cálido y cercano, tuteando.

PERFIL DE LA PERSONA:
- Deportes/actividades que disfruta: ${profile?.favoriteSports || "no especificado"}
- Días que prefiere entrenar: ${profile?.trainingDays || "no especificado"}
- Notas adicionales: ${profile?.notes || "ninguna"}
- Peso actual: ${goals.currentWeight || "desconocido"} kg / meta: ${goals.targetWeight || "no definida"} kg
- Nivel de actividad declarado: ${goals.activityLevel || "moderado"}
- Tendencia de peso reciente: ${weightTrend !== null ? `${weightTrend > 0 ? "+" : ""}${weightTrend} kg` : "sin datos"}

CONTEXTO DE HOY:
- Cómo se siente hoy: ${moodLabel}
- Días seguidos entrenando: ${consecutiveDays} ${consecutiveDays >= 5 ? "(¡considera recomendar descanso o algo muy suave!)" : ""}

Recomienda ejercicio para HOY priorizando lo que disfruta y respetando su estado de ánimo y energía. Responde SOLO con JSON sin markdown:
{"title":"nombre atractivo","duration":"minutos","intensity":"baja/moderada/alta","burned":número,"exercises":["ej1","ej2","ej3"],"reason":"por qué esto hoy, mencionando su ánimo/gustos, 2 oraciones cálidas","tip":"consejo motivacional personal y amable"}`;
    try {
      const res = await fetch("/.netlify/functions/claude", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          messages: [{
            role: "user",
            content: prompt
          }]
        })
      });
      const json = await res.json();
      const parsed = JSON.parse((json.content?.[0]?.text || "").replace(/```json|```/g, "").trim());
      setRecommendation(parsed);
      update(prev => ({
        ...prev,
        exercise: {
          ...prev.exercise,
          [today]: {
            ...(prev.exercise[today] || {}),
            recommendation: parsed
          }
        }
      }));
    } catch {
      setRecommendation({
        error: "No se pudo generar recomendación. Intenta de nuevo."
      });
    }
    setLoading(false);
  };
  const markCompleted = () => {
    const entry = {
      type: recommendation?.title || "Rutina recomendada",
      duration: recommendation?.duration || "30 min",
      burned: recommendation?.burned || 200,
      time: new Date().toLocaleTimeString("es-CO", {
        hour: "2-digit",
        minute: "2-digit"
      })
    };
    update(prev => {
      const alreadyDone = prev.exercise[today]?.completed;
      const addPts = alreadyDone ? 0 : 15;
      return {
        ...prev,
        exercise: {
          ...prev.exercise,
          [today]: {
            ...(prev.exercise[today] || {}),
            completed: true,
            logged: [...(prev.exercise[today]?.logged || []), entry]
          }
        },
        points: (prev.points || 0) + addPts,
        pointsLog: {
          ...(prev.pointsLog || {}),
          [today]: (prev.pointsLog && prev.pointsLog[today] || 0) + addPts
        }
      };
    });
    syncToSheets(user.id, user.name, "exercise", today, {
      ...entry,
      completed: true
    });
  };
  const logCustom = () => {
    if (!logForm.type) return;
    const entry = {
      ...logForm,
      burned: parseInt(logForm.burned) || 0,
      time: new Date().toLocaleTimeString("es-CO", {
        hour: "2-digit",
        minute: "2-digit"
      })
    };
